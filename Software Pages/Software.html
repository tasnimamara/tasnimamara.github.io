<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasnim's Portfolio!</title>
    <style>
        h1 {
            color: #6d3f3f; 
            font-size: 65px;
            margin-bottom: 10px;
        }
        
        body {
            background: #FAF0E6; 
            color: #3D3D3D; 
            font-family: 'Courier New', monospace, Consolas, 'Liberation Mono', monospace;
            margin: 0;
            padding: 0;
            cursor: none;
            line-height: 1.6; 
            letter-spacing: 0.01em; 
        }
        
        .container {
            max-width: 1500px;
            margin: 0 auto;
            padding: 20px;
        }
        
        button {
            background: #A57C65; 
            border: none;
            color: #FAF0E6; 
            font-family: inherit; 
            font-size: 22px;
            border-radius: 8px;
            padding: 10px 20px;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        button:hover {
            transform: translateY(-2px);
            background: #6B8E23; 
            color: #FFFFFF;
            box-shadow: 0 4px 8px rgba(107, 142, 35, 0.2);
        }
        
        h2 {
            color: #834e4e;
            letter-spacing: -0.02em; 
            margin-top: 0;
            margin-bottom: 10px;
            text-align: center;
            font-size: 28px;
        }
        
        header {
            border: 2px solid #6B8E23; 
            margin: 0 0 25px 0;
            padding: 18px;
            background: rgba(107, 142, 35, 0.08); 
            color: #654848;
            font-size: 20px;
            border-radius: 8px;
            font-weight: 700;
            text-align: center;
        }
        
        .header-nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }
        
        .home-button {
            margin: 0 auto 25px;
            display: block;
            text-align: center;
        }
        
        .page-header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .sections-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }
        
        section {
            border: 2px solid #6B8E23;
            border-radius: 8px;
            padding: 25px;
            background: rgba(107, 142, 35, 0.08); 
            line-height: 1.6; 
            box-shadow: 0 4px 12px rgba(107, 142, 35, 0.15); 
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            justify-content: center;
            min-height: 150px;
        }
        
        section:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 16px rgba(107, 142, 35, 0.2);
        }
        
        .project-image {
            width: 100%;
            max-width: 300px;
            height: 400px;
            object-fit: cover;
            border-radius: 6px;
            border: 2px solid #6B8E23;
            margin: 12px 0;
            transition: transform 0.3s ease;
        }
        
        section:hover .project-image {
            transform: scale(1.02);
        }
        
        .section-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        
        .section-button {
            margin-top: 12px;
        }
        
        .section-button button {
            width: 100%;
            max-width: 280px;
            padding: 12px 24px;
            font-size: 22px;
        }
        
        .software-section h2 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .software-section button {
            font-size: 22px;
            padding: 12px 30px;
        }
        
        /* small-screen tweaks */
        @media (max-width: 768px) {
            .sections-container {
                grid-template-columns: 1fr;
                gap: 18px;
            }
            
            .container {
                padding: 15px;
                max-width: 95%;
            }
            
            h1 {
                font-size: 48px;
                margin-bottom: 8px;
            }
            
            header {
                padding: 15px;
                margin-bottom: 20px;
                font-size: 18px;
            }
            
            .header-nav {
                gap: 8px;
            }
            
            .header-nav button {
                padding: 8px 16px;
                font-size: 22px;
            }
            
            .section-button button {
                max-width: 240px;
                padding: 10px 20px;
            }
            
            section {
                min-height: 120px;
                padding: 20px;
            }
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 12px;
            }
            
            body {
                line-height: 1.6;
            }
            
            section {
                padding: 18px 15px;
                min-height: 100px;
            }
            
            h1 {
                font-size: 40px;
            }
            
            .project-image {
                height: 300px;
                max-width: 280px;
            }
            
            .software-section button {
                font-size: 22px;
                padding: 10px 20px;
            }
        }
        
        p {
            font-size: 20px;
            color: #3b3a3a;
            margin-bottom: 1.2em;
            font-weight: 500;
            text-align: center;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.7;
        }
        
        .intro-paragraph {
            margin-bottom: 25px;
            padding: 0 5px;
            font-size: 22px;
        }
        
        a.header-buttons {
            color: #FAF0E6;
            text-decoration: none;
            font-size: 22px;
            transition: color 0.3s ease;
            display: inline-block;
        }
        
        a.header-buttons:hover {
            color: #FFFFFF;
            text-decoration: none;
        }
        
        .small {
            font-size: 16px;
            color: #666666; 
        }
        
        .custom-cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            background: transparent;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.1s ease;
            transform: translate(-50%, -50%);
            border: 2px solid #6B8E23; 
        }
        
        h1, h2, h3, h4, h5, h6 {
            font-weight: 600; 
            margin-top: 1em;
            margin-bottom: 0.6em;
        }
        
        code, pre {
            font-family: inherit; 
            background: rgba(107, 142, 35, 0.1);
            color: #3D3D3D;
            padding: 0.2em 0.4em;
            border-radius: 3px;
            border-left: 3px solid #6B8E23; 
        }
        
        /* Better focus states for accessibility */
        button:focus,
        a:focus {
            outline: 2px solid #6B8E23;
            outline-offset: 2px;
        }
        
        /* Smooth scroll for better UX */
        html {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body>
    <div class="container">
        <header> 
            Projects and Experiences
            <div class="header-nav">
                <button><a class="header-buttons" href="../index.html">⬅️ Home</a></button>
                <button><a class='header-buttons' href='../Resume.html'>Resume 📄</a></button>
                <button><a class='header-buttons' href='../Work Pages/Work.html'>Work 💼</a></button>
                <button><a class="header-buttons" href="../Hardware Pages/Hardware.html">Hardware 🔧</a></button>
                <button><a class="header-buttons" href="Software.html">Software 💻</a></button>
                <button><a class="header-buttons" href="../WEC.html">WEC 💡</a></button>  
            </div>
        </header>
        
        <div class="page-header">
            <h1>Software</h1>
            <p class="intro-paragraph">
                When it comes to coding, my interests lie solely in building things that allow my artistic self to shine. What stimulates me the most is front-end and game dev. Here are some things I've built!
            </p>
        </div>
        
        <div class="sections-container">
            <section class="software-section">
                <div class="section-content">
                    <h2>First Person Shooter Game using Ursina</h2>
                    <div class="section-button">
                        <button><a class="header-buttons" href="Game.html">View Project</a></button>
                    </div>
                </div>
            </section>
            
            <!--
            <section class="software-section">
                <div class="section-content">
                    <h2>Building a webapp using Streamlit</h2>
                    <div class="section-button">
                        <button><a class="header-buttons" href="Class.html">View Project</a></button>
                    </div>
                </div>
            </section>
            -->
        </div>
    </div>
    
    <div class="custom-cursor"></div>
    
    <script>
        const cursor = document.querySelector('.custom-cursor');

        document.addEventListener('mousemove', e => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });
        
        const interactiveElements = document.querySelectorAll('a, button, section');

        interactiveElements.forEach(element => {
            element.addEventListener('mouseenter', () => {
                cursor.style.transform = 'translate(-50%, -50%) scale(1.5)';
                cursor.style.borderColor = '#A57C65';
            });
            
            element.addEventListener('mouseleave', () => {
                cursor.style.transform = 'translate(-50%, -50%) scale(1)';
                cursor.style.borderColor = '#6B8E23';
            });
        });
    </script>
</body>
</html>
