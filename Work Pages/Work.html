<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasnim's Portfolio!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #FFFFFF;
            color: #1E1E1E;
            font-family: 'Courier New', Courier, monospace, Consolas, 'Liberation Mono';
            line-height: 1.5;
            letter-spacing: 0.01em;
            cursor: none;
        }

        .container {
            max-width: 1500px;
            margin: 0 auto;
            padding: 24px 32px;
        }

        h1, h2, h3, strong {
            color: #6A0DAD;                /* deep purple */
        }

        h1 {
            font-size: 58px;
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #6A0DAD;
        }

        h2 {
            color: #6A0DAD;
            font-size: 28px;
            margin: 0 0 10px 0;
            font-weight: 600;
            text-align: center;
        }

        header {
            border: 2px solid #9B4DFF;
            background: #F8F4FF;            /* very light purple tint */
            padding: 18px 20px;
            margin-bottom: 30px;
            border-radius: 14px;
            color: #1E1E1E;
            font-size: 20px;
            font-weight: 600;
            text-align: center;
            box-shadow: 0 2px 8px rgba(155,77,255,0.08);
        }

        .header-nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            background: #FFFFFF;
            border: 2px solid #9B4DFF;
            color: #1E1E1E;
            font-family: inherit;
            font-size: 20px;
            border-radius: 40px;
            padding: 10px 24px;
            transition: all 0.2s ease;
            cursor: pointer;
            font-weight: 500;
            box-shadow: 0 2px 0 #E0D0FF;
        }

        button:hover {
            background: #9B4DFF;
            color: #FFFFFF;
            border-color: #6A0DAD;
            box-shadow: 0 4px 12px rgba(106,13,173,0.25);
            transform: translateY(-2px);
        }

        a.header-buttons {
            color: inherit;
            text-decoration: none;
            display: inline-block;
        }

        .page-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .intro-paragraph {
            font-size: 22px;
            color: #1E1E1E;
            margin-bottom: 25px;
            padding: 0 5px;
            font-weight: 450;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.5;
        }

        .sections-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        section {
            border: 2px solid #9B4DFF;
            border-radius: 24px;
            padding: 30px;
            background: #FFFFFF;
            line-height: 1.5;
            box-shadow: 0 6px 18px rgba(106,13,173,0.06);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            justify-content: center;
            min-height: 180px;
        }

        section:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 28px rgba(106,13,173,0.12);
        }

        .work-section {
            min-height: 150px;
            padding: 25px;
        }

        .section-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .section-button {
            margin-top: 15px;
        }

        .section-button button {
            width: 100%;
            max-width: 280px;
            padding: 12px 24px;
            font-size: 22px;
        }

        .custom-cursor {
            position: fixed;
            width: 22px;
            height: 22px;
            background: transparent;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.1s ease;
            transform: translate(-50%, -50%);
            border: 2px solid #9B4DFF;
        }

        /* small‑screen tweaks */
        @media (max-width: 768px) {
            .container {
                padding: 18px 20px;
            }
            h1 {
                font-size: 48px;
            }
            h2 {
                font-size: 26px;
            }
            header {
                padding: 15px;
                font-size: 18px;
            }
            .header-nav button {
                padding: 8px 16px;
                font-size: 18px;
            }
            .sections-container {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            .section-button button {
                max-width: 240px;
                padding: 10px 20px;
            }
            section {
                min-height: 140px;
                padding: 25px 20px;
            }
            .work-section {
                min-height: 130px;
                padding: 20px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 40px;
            }
            .intro-paragraph {
                font-size: 20px;
            }
            section {
                padding: 20px 15px;
                min-height: 120px;
            }
            .work-section {
                min-height: 110px;
                padding: 18px 15px;
            }
            .section-button button {
                font-size: 22px;
                padding: 10px 20px;
            }
        }

        button:focus, a:focus {
            outline: 2px solid #9B4DFF;
            outline-offset: 2px;
        }

        html {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body>
    <div class="container">
        <header> 
            <div class="header-nav">
                <button><a class="header-buttons" href="../index.html">⬅️ Home</a></button>
                <button><a class='header-buttons' href='../Resume.html'>Resume 📄</a></button>
                <button><a class='header-buttons' href='Work.html'>Work 💼</a></button>
                <button><a class="header-buttons" href="../Hardware Pages/Hardware.html">Hardware 🔧</a></button>
                <button><a class="header-buttons" href="../Software Pages/Software.html">Software 💻</a></button>
                <button><a class="header-buttons" href="../EC Pages/EC.html">Extracurriculars 💡</a></button>  
            </div>
        </header>
        
        <div class="page-header">
            <h1>Work Experience</h1>
            <p class="intro-paragraph">
                Proof over promises. What I actually learned, built, and improved.
            </p>
        </div>
        
        <div class="sections-container">
            <section class="work-section">
                <div class="section-content">
                    <h2>MSAM [Dec 2025 – Present]</h2>
                    <div class="section-button">
                        <button><a class="header-buttons" href="MSAM.html">View Details</a></button>
                    </div>
                </div>
            </section>
        </div>
    </div>
    
    <div class="custom-cursor"></div>
    
    <script>
        const cursor = document.querySelector('.custom-cursor');
        document.addEventListener('mousemove', e => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        const interactiveElements = document.querySelectorAll('a, button, section');
        interactiveElements.forEach(el => {
            el.addEventListener('mouseenter', () => {
                cursor.style.transform = 'translate(-50%, -50%) scale(1.5)';
                cursor.style.borderColor = '#6A0DAD';
            });
            el.addEventListener('mouseleave', () => {
                cursor.style.transform = 'translate(-50%, -50%) scale(1)';
                cursor.style.borderColor = '#9B4DFF';
            });
        });
    </script>
</body>
</html>
