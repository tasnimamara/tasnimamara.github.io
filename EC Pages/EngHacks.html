<!DOCTYPE html>
<html lang="en">    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasnim's Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #FFFFFF;
            color: #1E1E1E;
            font-family: 'Courier New', Courier, monospace, Consolas, 'Liberation Mono';
            line-height: 1.5;
            letter-spacing: 0.01em;
            cursor: none;
        }

        .container {
            max-width: 1500px;
            margin: 0 auto;
            padding: 24px 32px;
        }

        h1, h2, h3, strong {
            color: #6A0DAD;                /* deep purple */
        }

        h1 {
            font-size: 58px;
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #6A0DAD;
        }

        h2 {
            color: #6A0DAD;
            letter-spacing: -0.02em;
            margin-top: 30px;
            margin-bottom: 15px;
            font-size: 32px;
        }

        h3 {
            color: #6A0DAD;
            margin-top: 25px;
            margin-bottom: 15px;
            font-size: 26px;
        }

        header {
            border: 2px solid #9B4DFF;
            background: #F8F4FF;            /* very light purple tint */
            padding: 18px 20px;
            margin-bottom: 30px;
            border-radius: 14px;
            color: #1E1E1E;
            font-size: 20px;
            font-weight: 600;
            text-align: center;
            box-shadow: 0 2px 8px rgba(155,77,255,0.08);
        }

        .header-nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            background: #FFFFFF;
            border: 2px solid #9B4DFF;
            color: #1E1E1E;
            font-family: inherit;
            font-size: 20px;
            border-radius: 40px;
            padding: 10px 24px;
            transition: all 0.2s ease;
            cursor: pointer;
            font-weight: 500;
            box-shadow: 0 2px 0 #E0D0FF;
        }

        button:hover {
            background: #9B4DFF;
            color: #FFFFFF;
            border-color: #6A0DAD;
            box-shadow: 0 4px 12px rgba(106,13,173,0.25);
            transform: translateY(-2px);
        }

        a.header-buttons {
            color: inherit;
            text-decoration: none;
            display: inline-block;
        }

        .home-button {
            margin: 0 auto 25px;
            display: block;
            text-align: center;
        }

        .page-header {
            text-align: center;
            margin-bottom: 30px;
        }

        section {
            border: 2px solid #9B4DFF;
            border-radius: 24px;
            padding: 30px;
            background: #FFFFFF;
            line-height: 1.5;
            box-shadow: 0 6px 18px rgba(106,13,173,0.06);
            margin-bottom: 30px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        section:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 28px rgba(106,13,173,0.12);
        }

        .content-section {
            max-width: 1500px;
            margin: 0 auto;
        }

        p {
            font-size: 24px;
            color: #1E1E1E;
            margin-bottom: 1.2em;
            font-weight: 450;
            line-height: 1.5;
            text-align: center;
            padding: 20px 0;
        }

        .inspiration-images {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            margin: 25px 0;
        }

        .inspiration-image {
            max-width: 400px;
            border-radius: 16px;
            border: 2px solid #9B4DFF;
            box-shadow: 0 4px 12px rgba(106,13,173,0.1);
        }

        ul {
            font-size: 19px;
            color: #1E1E1E;
            margin-bottom: 20px;
            padding-left: 25px;
            line-height: 1.6;
        }

        li {
            margin-bottom: 6px;
            padding-left: 6px;
        }

        .image-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin: 30px 0 50px;
        }

        .gallery-item {
            border: 2px solid #9B4DFF;
            border-radius: 20px;
            overflow: hidden;
            background: #FFFFFF;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 24px rgba(106,13,173,0.15);
        }

        .gallery-item img {
            width: 100%;
            height: 500px;
            object-fit: cover;
            display: block;
            transition: transform 0.2s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.02);
        }

        .custom-cursor {
            position: fixed;
            width: 22px;
            height: 22px;
            background: transparent;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.1s ease;
            transform: translate(-50%, -50%);
            border: 2px solid #9B4DFF;
        }

        /* small-screen tweaks */
        @media (max-width: 768px) {
            .container {
                padding: 18px 20px;
            }
            h1 {
                font-size: 48px;
            }
            h2 {
                font-size: 28px;
                margin-top: 25px;
            }
            h3 {
                font-size: 24px;
            }
            header {
                padding: 15px;
                font-size: 18px;
            }
            .header-nav button {
                padding: 8px 16px;
                font-size: 18px;
            }
            section {
                padding: 25px 20px;
            }
            p {
                font-size: 22px;
            }
            .gallery-item img {
                height: 400px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 40px;
            }
            h2 {
                font-size: 26px;
            }
            h3 {
                font-size: 22px;
            }
            p {
                font-size: 20px;
            }
            .gallery-item img {
                height: 300px;
            }
        }

        code, pre {
            background: #F4EEFF;
            color: #1E1E1E;
            padding: 0.2em 0.4em;
            border-radius: 6px;
            border-left: 3px solid #9B4DFF;
        }

        button:focus, a:focus {
            outline: 2px solid #9B4DFF;
            outline-offset: 2px;
        }

        html {
            scroll-behavior: smooth;
        }

        strong {
            color: #6A0DAD;
        }

        img {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <header> 
            Projects and Experiences
            <div class="header-nav">
                <button><a class="header-buttons" href="../index.html">⬅️ Home</a></button>
                <button><a class='header-buttons' href='../Resume.html'>Resume 📄</a></button>
                <button><a class='header-buttons' href='../Work Pages/Work.html'>Work 💼</a></button>
                <button><a class="header-buttons" href="../Hardware Pages/Hardware.html">Hardware 🔧</a></button>
                <button><a class="header-buttons" href="../Software Pages/Software.html">Software 💻</a></button>
                <button><a class="header-buttons" href="EC.html">Extracurriculars 💡</a></button>  
            </div>
        </header>
        
        <div class="page-header">
            <h1>EngHacks</h1>
        </div>
        
        <div class="content-section">
            <section>
                <p> Project details coming after March 10, 2026. Check back then!</p>
            </section>
        </div>
    </div>
    
    <div class="custom-cursor"></div>
    
    <script>
        const cursor = document.querySelector('.custom-cursor');
        document.addEventListener('mousemove', e => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        const interactiveElements = document.querySelectorAll('a, button, section');
        interactiveElements.forEach(el => {
            el.addEventListener('mouseenter', () => {
                cursor.style.transform = 'translate(-50%, -50%) scale(1.5)';
                cursor.style.borderColor = '#6A0DAD';
            });
            el.addEventListener('mouseleave', () => {
                cursor.style.transform = 'translate(-50%, -50%) scale(1)';
                cursor.style.borderColor = '#9B4DFF';
            });
        });
    </script>
</body>
</html>
