<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasnim's Portolio!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #FFFFFF;
            color: #1E1E1E;
            font-family: 'Courier New', Courier, monospace, Consolas, 'Liberation Mono';
            line-height: 1.5;
            letter-spacing: 0.01em;
            cursor: none;
        }

        .container {
            max-width: 1500px;
            margin: 0 auto;
            padding: 24px 32px;
        }

        h1, h2, h3, h4, strong {
            color: #6A0DAD;                /* deep purple */
        }

        h1 {
            font-size: 58px;
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #6A0DAD;
        }

        h2 {
            font-size: 28px;
            margin: 0 0 10px 0;
            font-weight: 600;
            text-align: center;
            color: #6A0DAD;
        }

        header {
            border: 2px solid #9B4DFF;
            background: #F8F4FF;            /* very light purple tint */
            padding: 18px 20px;
            margin-bottom: 30px;
            border-radius: 14px;
            color: #1E1E1E;
            font-size: 20px;
            font-weight: 600;
            text-align: center;
            box-shadow: 0 2px 8px rgba(155,77,255,0.08);
        }

        .header-nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            background: #FFFFFF;
            border: 2px solid #9B4DFF;
            color: #1E1E1E;
            font-family: inherit;
            font-size: 20px;
            border-radius: 40px;
            padding: 10px 24px;
            transition: all 0.2s ease;
            cursor: pointer;
            font-weight: 500;
            box-shadow: 0 2px 0 #E0D0FF;
        }

        button:hover {
            background: #9B4DFF;
            color: #FFFFFF;
            border-color: #6A0DAD;
            box-shadow: 0 4px 12px rgba(106,13,173,0.25);
            transform: translateY(-2px);
        }

        a.header-buttons {
            color: inherit;
            text-decoration: none;
            display: inline-block;
        }

        .page-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .intro-paragraph {
            font-size: 22px;
            color: #1E1E1E;
            margin-bottom: 25px;
            padding: 0 5px;
            font-weight: 450;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.5;
        }

        .section-background {
            background: #F8F4FF;            /* light purple tint */
            padding: 24px 28px;
            border-radius: 20px;
            border-left: 6px solid #9B4DFF;
            margin: 30px 0 40px;
            box-shadow: 0 4px 12px rgba(106,13,173,0.06);
        }

        .section-background h3 {
            font-size: 24px;
            margin-bottom: 16px;
            color: #6A0DAD;
        }

        .section-background h4 {
            font-size: 20px;
            font-weight: 450;
            color: #1E1E1E;
            line-height: 2;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .section-background h4 span {
            display: block;
            font-size: 20px;
            color: #1E1E1E;
        }

        .sections-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            margin-top: 20px;
        }

        section {
            border: 2px solid #9B4DFF;
            border-radius: 24px;
            padding: 28px 24px;
            background: #FFFFFF;
            line-height: 1.5;
            box-shadow: 0 6px 18px rgba(106,13,173,0.06);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        section:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 28px rgba(106,13,173,0.12);
        }

        .section-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .section-button {
            margin-top: 16px;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .section-button button {
            width: auto;
            min-width: 180px;
            padding: 10px 20px;
            font-size: 20px;
        }

        .custom-cursor {
            position: fixed;
            width: 22px;
            height: 22px;
            background: transparent;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.1s ease;
            transform: translate(-50%, -50%);
            border: 2px solid #9B4DFF;
        }

        /* small‑screen polish */
        @media (max-width: 768px) {
            .container {
                padding: 18px 20px;
            }
            h1 {
                font-size: 48px;
            }
            h2 {
                font-size: 26px;
            }
            header {
                padding: 15px;
                font-size: 18px;
            }
            .header-nav button {
                padding: 8px 16px;
                font-size: 18px;
            }
            .section-background {
                padding: 20px;
            }
            .section-background h4 {
                font-size: 18px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 40px;
            }
            .intro-paragraph {
                font-size: 20px;
            }
            .section-background h3 {
                font-size: 22px;
            }
        }

        button:focus, a:focus {
            outline: 2px solid #9B4DFF;
            outline-offset: 2px;
        }

        html {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body>
    <div class="container">

                <button><a class="header-buttons" href="EC.html">extracurriculars 💡</a></button>  
            </div>
        </header>
        
        <div class="page-header">

                <span>• <button><a class="header-buttons" href="EngHacks.html">waterloo eng hacks (w26)</a></button> </span>

    <div class="custom-cursor"></div>
    
    <script>
        const cursor = document.querySelector('.custom-cursor');
        document.addEventListener('mousemove', e => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        const interactiveElements = document.querySelectorAll('a, button, section');
        interactiveElements.forEach(el => {
            el.addEventListener('mouseenter', () => {
                cursor.style.transform = 'translate(-50%, -50%) scale(1.5)';
                cursor.style.borderColor = '#6A0DAD';
            });
            el.addEventListener('mouseleave', () => {
                cursor.style.transform = 'translate(-50%, -50%) scale(1)';
                cursor.style.borderColor = '#9B4DFF';
            });
        });
    </script>
</body>
</html>
