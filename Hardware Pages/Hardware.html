    a.header-buttons:hover {

    .image-section {
        flex: 1;

   .image-gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));

}
    .gallery-item {
        border: 2px solid #6B8E23; /* Slightly dark green border */
        border-radius: 8px;
        overflow: hidden;
        background: rgba(107, 142, 35, 0.08); /* Slightly dark green transparency */
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .gallery-item:hover {

        box-shadow: 0 8px 20px rgba(107, 142, 35, 0.2);
    }
    .gallery-item img {
        width: 100%;
        height: auto;
        object-fit: cover;
        display: block;
    }
    .small {
        font-size: 16px;
        color: #666666; 
    }
    .custom-cursor {
        position: fixed;
        width: 20px;
        height: 20px;
        background: transparent;
        border-radius: 50%;
        pointer-events: none;
        z-index: 9999;
        transition: transform 0.1s ease;
        transform: translate(-50%, -50%);
        border: 2px solid #6B8E23; 
    }
    .cursor {
        width: 40px;
        height: 40px;
        position: absolute;
        pointer-events: none;
    }
    
    h1, h2, h3, h4, h5, h6 {

        border-radius: 3px;

    /* Better focus states for accessibility */

    a:focus {

    /* Smooth scroll for better UX */
    html {

    section img {

    <div class="custom-cursor">
    </div>
    <script>
        const cursor = document.querySelector('.custom-cursor');

        document.addEventListener('mousemove', e => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });
        const interactiveElements = document.querySelectorAll('a, button, .nav-button, .gallery-item');

        interactiveElements.forEach(element => {
            element.addEventListener('mouseenter', () => {
                cursor.style.transform = 'translate(-50%, -50%) scale(1.5)';
            });
            
            element.addEventListener('mouseleave', () => {
                cursor.style.transform = 'translate(-50%, -50%) scale(1)';
            });
        });
    </script>
